alias: Alert If Fridge Door Open Over 5 Minutes
description: "Sends a notification to the phone if the fridge door has been open for more than 5 minutes."
trigger:
  - platform: state
    entity_id: input_boolean.fridge_door_is_open
    to: 'on'
action:
  - wait_template: >
      {% set started = states('input_datetime.fridge_door_opened_at') %}
      {% if started != 'unknown' and started != '' %}
        {% set started_time = strptime(started, '%Y-%m-%d %H:%M:%S') %}
        {{ (now() - started_time).total_seconds() > 300 }}
      {% else %}
        false
      {% endif %}
    timeout: '00:05:00'
    continue_on_timeout: false
  - condition: state
    entity_id: input_boolean.fridge_door_is_open
    state: 'on'
  - service: notify.mobile_app
    data:
      title: "Fridge Door Alert"
      message: "The fridge door has been open for more than 5 minutes."
mode: single 