# Configuration Variables
variables:
  compressor_power_threshold: 200    # Power threshold to detect compressor ON
  door_power_min: 40                 # Minimum power change when door opens/closes
  door_power_max: 70                 # Maximum power change when door opens/closes
  idle_power_threshold: 20           # Power threshold when fridge is idle

alias: Log Fridge Compressor and Door Activity
description: "Logs fridge compressor and door activity with duration to Google Sheets."
trigger:
  - platform: state
    entity_id: sensor.power_monitor  # Replace with your power sensor entity
action:
  - choose:
      # Compressor ON
      - conditions:
          - condition: numeric_state
            entity_id: sensor.power_monitor
            above: 200
          - condition: state
            entity_id: input_boolean.fridge_compressor_is_on
            state: 'off'
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.fridge_compressor_is_on
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.fridge_compressor_started_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: google_sheets.append_sheet
            data:
              worksheet: worksheet_name  # Replace with your worksheet name
              config_entry: YOUR_CONFIG_ENTRY_ID  # Replace with your config_entry ID
              data:
                State: "Compressor ON"
                Timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      
      # Compressor OFF
      - conditions:
          - condition: numeric_state
            entity_id: sensor.power_monitor
            below: 20
          - condition: state
            entity_id: input_boolean.fridge_compressor_is_on
            state: 'on'
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.fridge_compressor_is_on
          - service: google_sheets.append_sheet
            data:
              worksheet: worksheet_name
              config_entry: YOUR_CONFIG_ENTRY_ID
              data:
                State: "Compressor OFF"
                Elapsed_Time_Human: >
                  {% set started = states('input_datetime.fridge_compressor_started_at') %}
                  {% if started != 'unknown' and started != '' %}
                    {% set started_time = strptime(started, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo) %}
                    {{ ((now() - started_time).total_seconds() / 60) | int }} minutes
                  {% else %}
                    N/A
                  {% endif %}
                Elapsed_Time_Machine: >
                  {% set started = states('input_datetime.fridge_compressor_started_at') %}
                  {% if started != 'unknown' and started != '' %}
                    {% set started_time = strptime(started, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo) %}
                    {{ (now() - started_time).total_seconds() | int }}
                  {% else %}
                    N/A
                  {% endif %}
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.fridge_compressor_started_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      
      # Door Open
      - conditions:
          - condition: or
            conditions:
              # Door open while compressor is OFF
              - condition: and
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.power_monitor
                    above: 20
                    below: 200
                  - condition: state
                    entity_id: input_boolean.fridge_compressor_is_on
                    state: 'off'
              # Door open while compressor is ON
              - condition: and
                conditions:
                  - condition: template
                    value_template: >
                      {% set power = states('sensor.power_monitor') | float %}
                      {% set prev_power = states('sensor.power_monitor').attributes.previous_value | float %}
                      {{ power - prev_power > 40 and power - prev_power < 70 }}
                  - condition: state
                    entity_id: input_boolean.fridge_compressor_is_on
                    state: 'on'
          - condition: state
            entity_id: input_boolean.fridge_door_is_open
            state: 'off'
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.fridge_door_is_open
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.fridge_door_opened_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: google_sheets.append_sheet
            data:
              worksheet: worksheet_name
              config_entry: YOUR_CONFIG_ENTRY_ID
              data:
                State: "Door Open"
                Timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      
      # Door Closed
      - conditions:
          - condition: or
            conditions:
              # Door close while compressor is OFF
              - condition: and
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.power_monitor
                    below: 20
                  - condition: state
                    entity_id: input_boolean.fridge_compressor_is_on
                    state: 'off'
              # Door close while compressor is ON
              - condition: and
                conditions:
                  - condition: template
                    value_template: >
                      {% set power = states('sensor.power_monitor') | float %}
                      {% set prev_power = states('sensor.power_monitor').attributes.previous_value | float %}
                      {{ prev_power - power > 40 and prev_power - power < 70 }}
                  - condition: state
                    entity_id: input_boolean.fridge_compressor_is_on
                    state: 'on'
          - condition: state
            entity_id: input_boolean.fridge_door_is_open
            state: 'on'
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.fridge_door_is_open
          - service: google_sheets.append_sheet
            data:
              worksheet: worksheet_name
              config_entry: YOUR_CONFIG_ENTRY_ID
              data:
                State: "Door Closed"
                Elapsed_Time_Human: >
                  {% set opened = states('input_datetime.fridge_door_opened_at') %}
                  {% if opened != 'unknown' and opened != '' %}
                    {% set opened_time = strptime(opened, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo) %}
                    {{ ((now() - opened_time).total_seconds() / 60) | int }} minutes
                  {% else %}
                    N/A
                  {% endif %}
                Elapsed_Time_Machine: >
                  {% set opened = states('input_datetime.fridge_door_opened_at') %}
                  {% if opened != 'unknown' and opened != '' %}
                    {% set opened_time = strptime(opened, '%Y-%m-%d %H:%M:%S').replace(tzinfo=now().tzinfo) %}
                    {{ (now() - opened_time).total_seconds() | int }}
                  {% else %}
                    N/A
                  {% endif %}

mode: parallel
max: 4
